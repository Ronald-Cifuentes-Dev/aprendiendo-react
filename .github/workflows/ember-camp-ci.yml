name: Ember Camp CI

on:
  push:
    branches: [master]
    paths:
      - 'projects/ember-camp/**'
      - '.github/workflows/ember-camp-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'projects/ember-camp/**'
      - '.github/workflows/ember-camp-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ember-camp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify content and assets
        run: npm run verify:data

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
